<p>Geolocalization works!</p>

<table>
  <thead>
    <tr>
      <th>ID</th>
      <th>Shop Name</th>
      <th>Position X</th>
      <th>Position Y</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let geolocalitzation of geolocalitzations"(click)="showUsersOfGeolocalitzation(geolocalitzation._id,geolocalitzation.userWithOrders)">
      <td>{{ geolocalitzation._id }}</td>
      <td>{{ geolocalitzation.shopName }}</td>
      <td>{{ geolocalitzation.positionX }}</td>
      <td>{{ geolocalitzation.positionY }}</td>
    </tr>
  </tbody>
</table>
